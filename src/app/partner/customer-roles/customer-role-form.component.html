<section class="page-shell">

  <div class="page-shell-header d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div>
      <h1 class="page-title">{{ isEdit ? 'Edit Role' : 'New Role' }}</h1>
      <p class="page-subtitle">for <strong>{{ customerMode.activeCustomer()?.customerName }}</strong></p>
    </div>
    <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
      <i class="bi bi-arrow-left me-2"></i>Back to Roles
    </button>
  </div>

  @if (loading()) {
    <div class="d-flex justify-content-center align-items-center py-5">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading…</span>
      </div>
    </div>
  } @else {

  <form #roleForm="ngForm" (ngSubmit)="save()" novalidate>
    <div class="row g-4">
      <div class="col-12 col-lg-8">

        <div class="card mb-4">
          <div class="card-body">
            <h6 class="card-title fw-semibold mb-3">Role Information</h6>

            <div class="row g-3">
              <div class="col-12 col-sm-6">
                <label class="form-label fw-medium">Role Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control"
                       name="roleName" [(ngModel)]="formData.roleName"
                       required #nameCtrl="ngModel"
                       [class.is-invalid]="nameCtrl.invalid && nameCtrl.touched" />
                @if (nameCtrl.invalid && nameCtrl.touched) {
                  <div class="invalid-feedback">Role name is required.</div>
                }
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label fw-medium">Access Level <span class="text-danger">*</span></label>
                <select class="form-select" name="accessLevel" [(ngModel)]="formData.accessLevel">
                  <option value="EMPLOYEE">Employee</option>
                  <option value="APPROVER">Approver</option>
                  <option value="ADMIN">Admin</option>
                </select>
              </div>
              <div class="col-12 col-sm-6">
                <label class="form-label fw-medium">Allotment Type</label>
                <select class="form-select" name="allotmentType" [(ngModel)]="formData.allotmentType">
                  <option value="NONE">None</option>
                  <option value="DOLLAR">Dollar</option>
                  <option value="POINT">Point</option>
                  <option value="ITEM">Item</option>
                  <option value="COMBO">Combo</option>
                </select>
              </div>
              <div class="col-12 col-sm-6"></div>
              <div class="col-12">
                <label class="form-label fw-medium">Description</label>
                <textarea class="form-control" name="description" [(ngModel)]="formData.description" rows="3"></textarea>
              </div>
            </div>
          </div>
        </div>

      </div>
      <div class="col-12 col-lg-4">

        <div class="card mb-4">
          <div class="card-body">
            <h6 class="card-title fw-semibold mb-3">Status</h6>
            <select class="form-select" name="isActive" [(ngModel)]="formData.isActive">
              <option value="Y">Active</option>
              <option value="N">Inactive</option>
            </select>
          </div>
        </div>

      </div>
    </div>

    <div class="d-flex align-items-center justify-content-end gap-2 mt-2">
      @if (error()) {
        <div class="alert alert-danger d-flex align-items-center gap-2 mb-0 py-2 px-3 me-auto" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span>{{ error() }}</span>
        </div>
      }
      <button type="button" class="btn btn-outline-secondary" (click)="cancel()" [disabled]="saving()">Cancel</button>
      <button type="submit" class="btn btn-dark" [disabled]="saving()">
        @if (saving()) {
          <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Saving…
        } @else {
          <i class="bi bi-check-lg me-2"></i>{{ isEdit ? 'Save Changes' : 'Create Role' }}
        }
      </button>
    </div>

  </form>

  } <!-- end @else loading -->

</section>
